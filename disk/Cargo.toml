[package]
name = "disk"
version = "0.1.0"
authors = ["The ChromiumOS Authors"]
edition = "2021"

[lib]
path = "src/disk.rs"

[features]
android-sparse = []
composite-disk = ["crc32fast", "protos", "protobuf", "uuid"]
qcow = ["dep:flate2", "zstd"]
zstd-disk = ["zstd"]

[dependencies]
anyhow = "1"
async-trait = "0.1.36"
base = { path = "../base" }
cfg-if = "1.0.0"
crc32fast = { version = "1.2.1", optional = true }
cros_async = { path = "../cros_async" }
data_model = { path = "../common/data_model" }
# Use the zlib-rs backend: a pure-Rust port of zlib-ng that decompresses qcow2 zlib
# clusters noticeably faster than the default miniz_oxide backend, with no C toolchain
# required. This matches the backend AOSP's libflate2 already builds with.
flate2 = { version = "1", optional = true, default-features = false, features = ["zlib-rs"] }
libc = "0.2"
protobuf = { version = "3.2", optional = true }
protos = { path = "../protos", features = ["composite-disk"], optional = true }
remain = "0.2"
serde = { version = "1", features = ["derive"] }
sync = { path = "../common/sync" }
thiserror = "1"
uuid = { version = "1", features = ["v4"], optional = true }
vm_memory = { path = "../vm_memory" }
zerocopy = { version = "0.8.13", features = ["derive"] }
zstd = { version = "0.13", optional = true }

[target.'cfg(windows)'.dependencies]
winapi = "0.3"

[dependencies.futures]
version = "0.3"
default-features = false

[dev-dependencies]
tempfile = "3"
